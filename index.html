<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel RH MAZ v2</title>
<style>
:root{
  --bg:#f0f3f7; --bg2:#e7ecf2; --card:#ffffff; --ink:#1b2430; --muted:#5f6b7a; --line:#d9e0e9; --soft:#f4f6fa;
  --acc:#45648a; --acc-ink:#ffffff; --acc-soft:#e5ecf4; --acc2:#b8701f; --warn:#b4492f;
  --hero1:#4a6a90; --hero2:#7d9bbd; --hero-ink:#ffffff; --hero-muted:#e8eff7;
  --CAF:#3f6fb5; --FINEP:#c27c2c; --ROUANET:#1f8a64; --AD:#7a5aa6;
  --shadow:0 1px 2px rgba(16,40,32,.06),0 4px 14px rgba(16,40,32,.06); --chip-on:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#11151b; --bg2:#141a22; --card:#1a212b; --ink:#e7ebf1; --muted:#97a2b1; --line:#2b3542; --soft:#202935;
  --acc:#9db8d8; --acc-ink:#121c28; --acc-soft:#1f2a38; --acc2:#e0a35a; --warn:#e07a5f;
  --hero1:#1e2c3e; --hero2:#30445e; --hero-ink:#eef3fa; --hero-muted:#a9bdd6;
  --CAF:#7ea6e6; --FINEP:#e0a35a; --ROUANET:#4fc192; --AD:#b096d8; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --chip-on:#0b1a15;}
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 100%) fixed;color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh}
header{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:var(--hero-ink);padding:22px 28px 58px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
header .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted);margin-bottom:4px}
h1{margin:0;font-size:26px;letter-spacing:-.01em;font-weight:650}
.sub{color:var(--hero-muted);font-size:13px}
.wrap{padding:0 28px 48px;margin-top:-34px}
/* painel de filtros */
.bar{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.equipe{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:14px 18px;background:var(--acc-soft);border-bottom:1px solid var(--line)}
.eqlab{font-size:11px;color:var(--acc);line-height:1.25;text-transform:uppercase;letter-spacing:.08em;font-weight:600;min-width:200px}
.eqlab b{display:block;color:var(--ink);font-size:16px;letter-spacing:0;text-transform:none;font-weight:650}
.limpar{margin-left:auto}
.teams-wrap{flex:1 1 100%;margin-top:14px}
.teams-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px}
.teams-head .tk{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--hero-muted)}
.teams-head .tt{display:block;font-size:18px;font-weight:650;color:var(--hero-ink)}
.linkbtn{background:none;border:1px solid rgba(255,255,255,.45);color:var(--hero-ink);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.linkbtn:hover{background:rgba(255,255,255,.14)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.team{position:relative;border-radius:16px;padding:16px 18px 14px;cursor:pointer;user-select:none;transition:transform .12s,box-shadow .12s,background .12s;
  background:rgba(255,255,255,.10);border:1.5px dashed rgba(255,255,255,.45);color:var(--hero-ink)}
.team:hover{transform:translateY(-2px);background:rgba(255,255,255,.16)}
.team.on{background:var(--card);border:1.5px solid transparent;color:var(--ink);box-shadow:0 8px 22px rgba(15,30,50,.22)}
.team .chk{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-size:14px;font-weight:700;color:transparent}
.team.on .chk{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.team .nm{font-size:22px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.team .cd{font-size:12px;opacity:.75;margin-top:2px}
.team .val{font-size:20px;font-weight:650;margin-top:12px;font-variant-numeric:tabular-nums}
.team .meta{font-size:12px;opacity:.8}
.team .shr{height:5px;border-radius:3px;background:rgba(127,127,127,.22);margin-top:10px;overflow:hidden}
.team .shr span{display:block;height:100%;background:var(--acc)}
.team:not(.on) .shr span{background:rgba(255,255,255,.7)}
.team .so{position:absolute;top:44px;right:12px;font-size:11px;border:0;background:none;color:inherit;opacity:.65;cursor:pointer;text-decoration:underline;font:inherit;font-size:11px}
.team .so:hover{opacity:1}
.barhead{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.groups{display:grid;grid-template-columns:auto minmax(260px,1.3fr) minmax(320px,1.5fr);}
.fgroup{padding:12px 18px 14px;display:flex;flex-wrap:wrap;gap:10px 14px;align-content:flex-start;border-left:1px solid var(--line)}
.fgroup:first-child{border-left:0}
.fgroup h4{flex:1 1 100%;margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.f{display:flex;flex-direction:column;gap:4px;min-width:110px}
.f label{font-size:11px;color:var(--muted);letter-spacing:.02em}
select,input{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--soft);color:var(--ink);max-width:260px}
select:focus,input:focus{outline:2px solid var(--acc);outline-offset:1px;background:var(--card)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--soft)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 16px;font:inherit;cursor:pointer}
.seg button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;user-select:none;font-size:13px;background:var(--soft);color:var(--muted);transition:background .12s}
.chip:hover{border-color:var(--acc)}
.chip.on{color:var(--chip-on);border-color:transparent;font-weight:600}
.chips.big .chip{font-size:15px;padding:8px 18px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--acc) 45%,var(--line));color:var(--acc);font-weight:600}
.chips.big .chip.on{color:var(--acc-ink);border-color:transparent;box-shadow:0 2px 6px rgba(69,100,138,.22)}
.chips.big .chip small{font-weight:400;opacity:.75;margin-left:6px;font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 14px;cursor:pointer;font:inherit}
.btn:hover{border-color:var(--acc);color:var(--acc)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
.kpis.side{grid-template-columns:1fr;margin-bottom:0;position:sticky;top:12px}
.content{min-width:0}
#barhead{cursor:pointer;gap:10px;justify-content:flex-start}
#barhead .bt{color:var(--ink)}
#barhead .plus{margin:0}
.fsum{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.bar.closed #fgroups{display:none}
.bar.closed .barhead{border-bottom:0}
@media (max-width:900px){.main{grid-template-columns:1fr}.kpis.side{grid-template-columns:repeat(2,1fr);position:static}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:var(--shadow);border-top:3px solid var(--acc)}
.kpi:first-child{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-color:transparent}
.kpi:first-child .l,.kpi:first-child .s{color:var(--hero-muted)}
.kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:23px;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
/* abas */
.tabs{display:inline-flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.tab{padding:8px 18px;cursor:pointer;border:0;background:none;color:var(--muted);font:inherit;border-radius:9px}
.tab.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;overflow:auto;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:14px}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.tot td{font-weight:650;background:var(--acc-soft);border-top:2px solid var(--acc)}
tr.grp td{font-weight:650;background:var(--acc-soft);color:var(--ink)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
tr.det td{background:var(--soft);font-size:12px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin:1px 3px 1px 0;color:var(--chip-on);white-space:nowrap}
.plus{margin-left:6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--acc);background:var(--card);color:var(--acc);font-weight:700;line-height:16px;padding:0;cursor:pointer}
.plus:hover{background:var(--acc);color:#fff}
.plus.mini{width:18px;height:18px;line-height:14px;font-size:13px;margin:0 8px 0 0;vertical-align:-2px}
tr.ger{cursor:pointer} tr.ger:hover td{background:var(--soft)}
.btn.mini{font-size:11px;padding:2px 8px;margin-left:8px;text-transform:none;letter-spacing:0;font-weight:500}
.ano{display:block;font-size:11px;font-weight:400;color:var(--muted);opacity:.85;margin-top:1px}
.kpi .ano{font-size:12px;margin-top:0}
.kpi:first-child .ano{color:var(--hero-muted)}
td .tag{font-size:11px}
.tabrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.tabrow .tabs{margin-bottom:0}
.gerall{padding:8px 16px;box-shadow:var(--shadow)}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 10px}
.cardhead h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cardhead .btn.mini{font-size:12px;padding:4px 12px;margin:0}
th.fsub{background:var(--soft)}
.flag{font-size:11px;color:var(--acc2)}
.muted{color:var(--muted)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.hide{display:none}
@media (max-width:980px){.groups{grid-template-columns:1fr}.fgroup{border-left:0;border-top:1px solid var(--line)}.fgroup:first-child{border-top:0}}
@media (max-width:640px){header{padding:18px 16px 60px}.wrap{padding:0 16px 32px}.limpar{margin-left:0}}
</style>
</head>

<header>
  <div>

    <div class="sub" id="subtitle"></div>

      <div class="fgroup"><h4>Pessoas</h4>
        <div class="f" style="flex:1 1 200px"><label>Colaborador</label><input id="busca" list="nomes" placeholder="Digite um nome"><datalist id="nomes"></datalist></div>
        <div class="f"><label>Vínculo</label><select id="fVin"></select></div>
        <div class="f"><label>Meio / fim</label><select id="fMF"></select></div>

    </div>
  </div>

  <div class="main">
  <aside class="kpis side" id="kpis"></aside>
  <div class="content">

  <div class="tabrow"><div class="tabs" id="tabs"></div><button class="btn gerall" id="gerAll"></button></div>
  <section id="v-org"></section>
  <section id="v-colab" class="hide"></section>
  </div>
  </div>
</div>

  if(p.salReal && rr.length) return p.salReal;
  const ben = r => r.comp ? Object.values(r.comp).reduce((a,b)=>a+b,0) : 0;
  if(p.vinculo==="PJ"){ const v=rr.reduce((a,r)=>a+r.custo-ben(r),0); return v? v/p.qtd : null; }
  const se = rr.reduce((a,r)=>a+(r.comp?r.comp.se:0),0);
  return se ? se/(1+t)/p.qtd : null;
}

function byPerson(rows){
  const m={};
  rows.forEach(r=>{ (m[r.key] ||= {key:r.key, v:0, f:{}, cc:{}}); const x=m[r.key]; x.v+=r.v; x.f[r.fonte]=(x.f[r.fonte]||0)+r.v; const c=r.cc+" · "+r.desc+" · proj "+(PROJ[r.proj]||r.proj); x.cc[c]=(x.cc[c]||0)+r.v; });
  return Object.values(m).filter(x=>x.v>0.004);
}
function group(rows, fn){
  const m={};
  rows.forEach(r=>{ const g=fn(r); (m[g] ||= {g, v:0, f:{}, keys:new Set()}); m[g].v+=r.v; m[g].f[r.fonte]=(m[g].f[r.fonte]||0)+r.v; m[g].keys.add(r.key); });
  return Object.values(m).sort((a,b)=>b.v-a.v);
}
const hc = keys => [...keys].reduce((a,k)=>a+P[k].qtd,0);

function vGeral(rows, pp, total){
  const blocks = [
    ["Por fonte pagadora", group(rows,r=>r.fonte), g=>g.g==="A DEFINIR"?"A definir":g.g],
    ["Por diretoria", group(rows,r=>P[r.key].diretoria), g=>tc(g.g)],
    ["Por gerência / coordenação", group(rows,r=>P[r.key].gerencia), g=>tc(g.g)],
    ["Por área (centro de custo)", group(rows,r=>ccArea(r.desc)), g=>g.g],
    ["Meio × fim", group(rows,r=>P[r.key].meiofim), g=>tc(g.g)],
    ["Por atuação (equipe mínima × time Belém × institucional)", group(rows,r=>P[r.key].atuacao), g=>g.g],
  ];
  let h = `<div class="grid2">`;
  blocks.forEach(([t,gs,lab])=>{ const max=Math.max(...gs.map(g=>g.v),1);
    h += `<div class="card"><h3>${t}</h3>${legend()}${gs.map(g=>stackBar(`${esc(lab(g))} <span class="muted">· ${hc(g.keys)}</span>`, g.v, g.f, max)).join("")}</div>`; });
  /* composição */
  const rr=refRows(), comp={}; let base=0;
  rr.forEach(r=>{ COMP.forEach(([k])=>comp[k]=(comp[k]||0)+r.comp[k]); base+=r.custo; });
  const pj = rr.filter(r=>P[r.key].vinculo==="PJ").reduce((a,r)=>a+r.custo-Object.values(r.comp).reduce((x,y)=>x+y,0),0);
  const t=st.enc/100, salTot=rr.filter(r=>P[r.key].vinculo==="CLT").reduce((a,r)=>a+(P[r.key].salReal? P[r.key].salReal*(r.comp.se/(rr.filter(x=>x.key===r.key).reduce((s,x)=>s+x.comp.se,0)||1)) : r.comp.se/(1+t)),0), encTot=(comp.se||0)-salTot;
  const parts=[["Salário (estimado)",salTot],["Encargos (estimado)",encTot],...COMP.slice(1).map(([k,l])=>[l,comp[k]||0]),["Contratos PJ",pj]];
  const somado=parts.reduce((a,x)=>a+x[1],0); parts.push(["Ajuste da planilha",base-somado]);
  const mx=Math.max(...parts.map(x=>Math.abs(x[1])),1);
  h += `<div class="card"><h3>Composição do custo · ${MES[REF[st.ano]-1]}/${st.ano}</h3>${parts.map(([l,v])=>`<div class="hb"><div>${l}</div><div class="t"><span style="width:${(Math.abs(v)/mx*100).toFixed(2)}%;background:var(--acc)"></span></div><div class="n">${brl(v)}</div></div>`).join("")}<div class="note">“Ajuste da planilha” é a diferença entre o custo informado e a soma das colunas de composição.</div></div>`;
  /* maiores custos */
  const top=[...pp].sort((a,b)=>b.v-a.v).slice(0,12), mt=top[0]?top[0].v:1;
  h += `<div class="card"><h3>Maiores custos individuais</h3>${legend()}${top.map(x=>stackBar(esc(tc(P[x.key].nome)), x.v, x.f, mt)).join("")}</div></div>`;
  document.getElementById("v-geral").innerHTML=h;
}

}

function vOrg(rows, pp, total){
  const fs=st.orgOpen?fcols():[], byD=group(rows,r=>P[r.key].diretoria);
  let h=`<div class="card"><table><thead><tr><th>Diretoria › gerência › colaborador</th><th class="num">Posições</th><th class="num">Salário est. <button class="plus" id="orgPlus" title="${st.orgOpen?"Ocultar":"Mostrar"} custo por fonte pagadora">${st.orgOpen?"−":"+"}</button></th>${fs.map(f=>`<th class="num fsub"><span class="dot" style="background:${FCOL[f]}"></span>${f}</th>`).join("")}<th class="num">Custo mensal</th><th class="num">%</th>${st.orgOpen?"":"<th>Fontes</th>"}</tr></thead><tbody>`;
  const salOf = keys => [...keys].reduce((a,k)=>{const s=salarioEst(k); return a+(s?s*P[k].qtd:0);},0);
  byD.forEach(d=>{
    h+=`<tr class="grp"><td>${esc(tc(d.g))}</td><td class="num">${hc(d.keys)}</td><td class="num">${brl(salOf(d.keys))}</td>${fs.map(f=>cm(d.f[f]||0)).join("")}${cm(d.v)}<td class="num">${pct(d.v/(total||1))}</td>${st.orgOpen?"":`<td>${tags(d.f)}</td>`}</tr>`;
    group(rows.filter(r=>P[r.key].diretoria===d.g), r=>P[r.key].gerencia).forEach(g=>{
      const gk=d.g+"|"+g.g, aberta=!st.gerClosed.has(gk);
      h+=`<tr class="ger" data-g="${esc(gk)}"><td style="padding-left:22px"><button class="plus mini" tabindex="-1">${aberta?"−":"+"}</button><b>${esc(tc(g.g))}</b></td><td class="num">${hc(g.keys)}</td><td class="num">${brl(salOf(g.keys))}</td>${fs.map(f=>cm(g.f[f]||0)).join("")}${cm(g.v)}<td class="num">${pct(g.v/(total||1))}</td>${st.orgOpen?"":`<td>${tags(g.f)}</td>`}</tr>`;
      if(aberta) byPerson(rows.filter(r=>P[r.key].gerencia===g.g && P[r.key].diretoria===d.g)).sort((a,b)=>b.v-a.v).forEach(x=>{ const p=P[x.key], s=salarioEst(x.key);
        h+=`<tr><td style="padding-left:58px" class="muted">${esc(tc(p.nome))} · ${esc(tc(p.funcao))}</td><td class="num muted">${p.qtd}</td><td class="num muted">${brl(s?s*p.qtd:null)}</td>${fs.map(f=>cm(x.f[f]||0,"muted")).join("")}${cm(x.v,"muted",true)}<td></td>${st.orgOpen?"":`<td>${tags(x.f)}</td>`}</tr>`; });
    });
  });
  h+=`<tr class="tot"><td>Total</td><td class="num">${pp.reduce((a,x)=>a+P[x.key].qtd,0)}</td><td class="num">${brl(salOf(new Set(pp.map(x=>x.key))))}</td>${fs.map(f=>cm(rows.filter(r=>r.fonte===f).reduce((a,r)=>a+r.v,0))).join("")}${cm(total)}<td class="num">100%</td>${st.orgOpen?"":"<td></td>"}</tr></tbody></table></div>`;
  document.getElementById("v-org").innerHTML=h+(st.orgOpen?`<div class="note" style="margin:8px 4px">Colunas por fonte = custo pago por cada fonte. Valores anuais = custo mensal × 12.</div>`:"");
  orgPlus.onclick=e=>{ e.stopPropagation(); st.orgOpen=!st.orgOpen; render(); };
  document.querySelectorAll("#v-org tr.ger").forEach(tr=>tr.onclick=()=>{ const k=tr.dataset.g; st.gerClosed.has(k)?st.gerClosed.delete(k):st.gerClosed.add(k); render(); });
  gerAll.textContent=st.gerClosed.size?"Abrir todas":"Fechar todas";
  gerAll.onclick=e=>{ e.stopPropagation(); if(st.gerClosed.size) st.gerClosed.clear(); else document.querySelectorAll("#v-org tr.ger").forEach(tr=>st.gerClosed.add(tr.dataset.g)); render(); };
}

function vMes(){
  const ano=st.ano, ms=monthsOf(ano), all=R.filter(r=>r.ano===ano && rowOk(r));
  const cell=(v)=>`<td class="num">${v?brl(v):'<span class="muted">—</span>'}</td>`;
  let h=`<div class="card"><h3>Custo mensal ${ano} por fonte pagadora</h3><table><thead><tr><th>Fonte</th>${MES.map((m,i)=>`<th class="num">${m}</th>`).join("")}<th class="num">Média meses c/ dado</th></tr></thead><tbody>`;
  const tm=Array(12).fill(0);
  fcols().forEach(f=>{ const v=Array(12).fill(0); all.filter(r=>r.fonte===f).forEach(r=>{v[r.mes-1]+=r.custo; tm[r.mes-1]+=r.custo;});
    if(v.some(x=>x)) h+=`<tr><td><span class="dot" style="background:${FCOL[f]}"></span>${f==="A DEFINIR"?"A definir":f}</td>${v.map(cell).join("")}<td class="num">${brl(ms.reduce((a,m)=>a+v[m-1],0)/ms.length)}</td></tr>`; });
  h+=`<tr class="tot"><td>Total</td>${tm.map(cell).join("")}<td class="num">${brl(ms.reduce((a,m)=>a+tm[m-1],0)/ms.length)}</td></tr></tbody></table>
  <div class="note">MAZ: ${ano===2026?"só há a folha de <b>novembro/2026</b> (faltam os arquivos mensais V3 de CAF, FINEP e Rouanet)":"a previsão 2027 traz apenas <b>janeiro a abril</b>"}. MUSEDUCA: todos os meses de 2026 e jan–abr/2027. FMA: orçamento 2026 completo (jan–dez); sem dados para 2027. Meses sem dado aparecem vazios.</div></div>`;
  /* por colaborador */
  const keys=[...new Set(all.map(r=>r.key))].filter(k=>all.some(r=>r.key===k&&r.custo)).sort((a,b)=>P[a].nome.localeCompare(P[b].nome,"pt"));
  h+=`<div class="card" style="margin-top:14px"><h3>Custo mensal ${ano} por colaborador</h3><table id="tMes"><thead><tr><th data-k>Colaborador</th><th data-k>Gerência</th>${MES.map(m=>`<th data-k class="num">${m}</th>`).join("")}<th data-k class="num">Média</th></tr></thead><tbody>`;
  keys.forEach(k=>{ const v=Array(12).fill(0); all.filter(r=>r.key===k).forEach(r=>v[r.mes-1]+=r.custo); const md=ms.reduce((a,m)=>a+v[m-1],0)/ms.length;
    h+=`<tr class="click" data-k="${k}"><td>${esc(tc(P[k].nome))}</td><td class="muted">${esc(tc(P[k].gerencia))}</td>${v.map((x,i)=>`<td class="num" data-s="${x}">${x?brl(x):'<span class="muted">—</span>'}</td>`).join("")}<td class="num" data-s="${md}">${brl(md)}</td></tr>`; });
  h+=`<tr class="tot"><td colspan="2">Total</td>${tm.map(cell).join("")}<td class="num">${brl(ms.reduce((a,m)=>a+tm[m-1],0)/ms.length)}</td></tr></tbody></table></div>`;
  document.getElementById("v-mes").innerHTML=h; sortable("tMes");
}

function vCC(rows, pp, total){
  const m={}; rows.forEach(r=>{ const k=r.fonte+"|"+r.cc+"|"+r.proj; (m[k] ||= {fonte:r.fonte, cc:r.cc, desc:r.desc, proj:r.proj, v:0, keys:new Set()}); m[k].v+=r.v; m[k].keys.add(r.key); });
  const L=Object.values(m).sort((a,b)=>a.fonte.localeCompare(b.fonte)||b.v-a.v);
  let h=`<div class="card"><table id="tCC"><thead><tr><th data-k>Fonte</th><th data-k>Centro de custo</th><th data-k>Descrição</th><th data-k>Projeto</th><th data-k class="num">Posições</th><th data-k class="num">Custo mensal</th><th data-k class="num">%</th></tr></thead><tbody>`;
  L.forEach(x=>h+=`<tr class="click"><td><span class="dot" style="background:${FCOL[x.fonte]}"></span>${x.fonte}</td><td>${x.cc}</td><td>${esc(x.desc)}</td><td>${PROJ[x.proj]||x.proj}</td><td class="num" data-s="${hc(x.keys)}">${hc(x.keys)}</td><td class="num" data-s="${x.v}">${brl2(x.v)}</td><td class="num" data-s="${x.v}">${pct(x.v/(total||1))}</td></tr>`);
  h+=`<tr class="tot"><td colspan="5">Total</td><td class="num">${brl2(total)}</td><td class="num">100%</td></tr></tbody></table><div class="note">O centro de custo 01.55.109.555 (Departamento Pessoal CAF) recebe a parcela CAF de quem é rateado — em geral VA/VR complementar, seguro e parte do salário.</div></div>`;
  document.getElementById("v-cc").innerHTML=h; sortable("tCC");
}

function vNotas(){
  document.getElementById("v-notas").innerHTML=`<div class="card"><ul class="notes">
  <li><b>Custo mensalizado</b> é a coluna “CUSTO MÊS” das folhas: salário, encargos, provisões mensais de 13º e de 1/3 de férias e benefícios. Para PJ, o valor do contrato.</li>
  <li><b>Bases:</b> 2026 = folha de novembro (aba Detalhe da “Folha_MAZ_por_Colaborador_Nov2026”). 2027 = janeiro a abril (aba Detalhe da “Folha_MAZ_2027_por_Colaborador_Mar2027”). Totais conferidos com as planilhas (antes dos ajustes de 14/10): nov/26 R$ 711.909,36; jan/27 R$ 634.004,23; fev/27 R$ 647.135,93; mar/27 R$ 673.103,80; abr/27 R$ 686.352,02.</li>
  <li><b>Salário estimado:</b> as folhas não trazem o salário base, só “Salários e encargos”. O painel divide esse valor por 1,307 (encargos de 30,7%, calibrados em cinco pessoas cujo valor bate exatamente com a Tabela 2025 + 5%: Nivaldo, Carlos, Ingrid, Paula e Victoria). Para Marcela (FMA), usa o salário real do orçamento FMA. Para PJ, o valor do contrato, sem benefícios.</li>
  <li><b>Gerência e diretoria</b> vêm da Tabela 2025. Quem não consta lá (marcado com *) recebeu a gerência pelo cargo e centro de custo — por exemplo, Alana na Coordenação de Atendimento e Educação. Camila aparece na Gerência Técnica MAZ (cargo atual), não mais em Comunicação.</li>
  <li><b>Vagas sem titular</b> (Auxiliar de Atendimento I ×9, II ×6, Líder de Atendimento, Analista de DP Jr, Analista de PCO Pleno) estão agrupadas por cargo; “posições” conta cada vaga.</li>
  <li><b>Projeto 000 - Time Projetos:</b> Amarilis, Claire, Débora, Erick, Iago, Leandro, Tatiana Azevedo (PJ), Tatiane Proba e Vitor Garcez (MAZ), Sergio Mendes (MUSEDUCA) e Marcela Domingos (FMA) estão no projeto 000, com todas as parcelas (inclusive a CAF), nos dois anos. Na aba por colaborador, o projeto original da planilha aparece como “na planilha: 003/222”. Essa mudança é só do painel; para valer no orçamento precisa ser refletida no MXM.</li><li><b>2027:</b> a PJ de Tatiana Azevedo e a Hydro não constam dos arquivos de 2027.</li>
  <li><b>Fonte pagadora por equipamento:</b> MAZ — CAF, Rouanet, FINEP e BNDES; MDA — Rouanet e Verba Livre; MUSEDUCA, MATRIZ e FMA — Verba Livre. O filtro de fonte mostra só as fontes dos equipamentos selecionados.</li>
  <li><b>Equipamento:</b> o painel abre só com o MAZ selecionado. MUSEDUCA tem Marlis Silva (PJ, R$ 24.750) e Sergio Mendes (PJ, R$ 41.904 + R$ 10.000 de plano de saúde = R$ 51.904), pagos com Verba Livre, lançados em todos os meses de 2026 e em janeiro a abril de 2027. FMA tem Marcela Domingos, com o custo mês a mês do orçamento FMA 2026 (revisado em 01/07/2026); o orçamento prevê Dante Coelho como substituto dela. MDA e MATRIZ ainda não têm colaboradores no painel.</li>
  <li><b>Ajustes de 14/10:</b> Danielle Azevedo está afastada pelo INSS — a parcela FINEP foi retirada e fica só a parcela CAF. Gabriela de Souza Carvalho foi desligada e saiu do painel.</li>
  <li><b>Modelos de visualização:</b> as visões por fonte, área, meio × fim e atuação seguem os recortes das tabelas dinâmicas da Tabela Salarial 2025 (TD – Fonte pagadora, TD – Equipe mínima, Área, Meio/Fim, Análise por área e por fonte).</li>
  </ul></div>`;
}

initControls(); render();
</script>
